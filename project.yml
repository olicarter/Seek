name: Seek
options:
  bundleIdPrefix: dev.olicarter
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird
    from: 2.5.0
settings:
  base:
    DEVELOPMENT_TEAM: MPCJ63V5P5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Seek:
    type: application
    platform: iOS
    sources:
      - path: Seek
        excludes: [WebServer]
      # Seek on the web, served by the Mac app (see WebServer.swift): the Mac only.
      - path: Seek/WebServer
        destinationFilters: [macCatalyst]
      - path: Shared
        destinationFilters: [macCatalyst]
    dependencies:
      - package: ZIPFoundation
      - target: SeekShare
      - package: Hummingbird
        product: Hummingbird
        destinationFilters: [macCatalyst]
    postCompileScripts:
      # The site (web/), bundled into the Mac app, which serves it.
      - name: Bundle the web site
        basedOnDependencyAnalysis: false
        script: |
          [ "$IS_MACCATALYST" = "YES" ] || exit 0
          export PATH="$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node" 2>/dev/null | tail -1)/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/web"
          [ -d node_modules ] || npm ci --no-audit --no-fund
          npx vite build --logLevel warn --outDir "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web" --emptyOutDir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.olicarter.seek
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The web site's build script reads web/ and writes into the app.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Seek/Info.plist
      properties:
        CFBundleDisplayName: Seek
        # The ad hoc tool stamps each build with its own number, so iOS updates in place.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, remote-notification]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # seek://search?q=… and seek://share?text=… (from the share extension).
        CFBundleURLTypes:
          - CFBundleURLName: dev.olicarter.seek
            CFBundleURLSchemes: [seek]
        NSLocalNetworkUsageDescription: Seek listens for incoming Soulseek peer connections.
        NSUbiquitousContainers:
          iCloud.dev.olicarter.seek:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Seek
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Seek/Seek.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.dev.olicarter.seek]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.dev.olicarter.seek]
        com.apple.developer.icloud-services: [CloudDocuments, CloudKit]
  # "Seek" in the share sheet, for songs from Shazam and Apple Music.
  SeekShare:
    type: app-extension
    platform: iOS
    sources: [SeekShare]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.olicarter.seek.share
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    info:
      path: SeekShare/Info.plist
      properties:
        CFBundleDisplayName: Seek
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  # Seek on the Apple TV: a client of Seek on the Mac, like the site (see SeekTV/Connection.swift).
  SeekTV:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources: [SeekTV, Shared, Seek/Library/SoundQuality.swift, Seek/Library/ArtworkColor.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.olicarter.seek.tv
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Mac's address (its Tailscale Funnel one), given when building for the TV: it isn't
        # kept in this public repo.
        SEEK_SERVER: ""
    info:
      path: SeekTV/Info.plist
      properties:
        CFBundleDisplayName: Seek
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        SeekServer: $(SEEK_SERVER)
        ITSAppUsesNonExemptEncryption: false
  SeekTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SeekTests]
    dependencies:
      - target: Seek
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.olicarter.seek.tests
schemes:
  SeekTV:
    build:
      targets:
        SeekTV: all
  Seek:
    build:
      targets:
        Seek: all
    test:
      targets: [SeekTests]
